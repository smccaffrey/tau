name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include steps to reproduce, and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `tau version`
      placeholder: "0.1.0"
  - type: dropdown
    id: install
    attributes:
      label: How are you running Tau?
      options:
        - install.sh
        - pip / uv install
        - Docker / other
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant tau inspect or taud output. Remove any secrets first.
      render: shell
